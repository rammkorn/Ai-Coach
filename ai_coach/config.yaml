name: AI Coach Flessioni
version: "1.0.3"
slug: ai_coach
description: >-
  Coach AI auto-evolutivo per le flessioni: progressione adattiva, ritmo guidato,
  rilevamento del movimento e notifiche push. Tutto su un file SQLite persistente.
url: https://github.com/rammkorn/ai-coach
# Architetture supportate (le più comuni per Home Assistant).
arch:
  - aarch64
  - amd64
  - armv7
# Avvio gestito dal nostro CMD (niente init di sistema dell'add-on).
init: false
# Espone la porta 3000 sull'host, così il tunnel Cloudflare può puntarci.
ports:
  8888/tcp: 8888
ports_description:
  8888/tcp: Interfaccia web del coach — puntaci l'additional_host di Cloudflared
# Opzioni configurabili dall'interfaccia di Home Assistant.
options:
  vapid_contact: "mailto:rammkorn@gmail.com"
  reset_profile: ""
  reset_password: ""
schema:
  # Contatto per le chiavi VAPID delle notifiche push.
  vapid_contact: str?
  # Reset password "amministrativo" (per password dimenticate degli utenti
  # interni): scrivi il NOME del profilo e la NUOVA password, salva e riavvia
  # l'add-on. Poi svuota di nuovo i due campi.
  reset_profile: str?
  reset_password: str?
